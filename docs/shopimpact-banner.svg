<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">ShopImpact</title>
  <desc id="d">ShopImpact banner: a personal consumption journal and experiment workspace, with a bar chart with error bars and a turtle mascot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a2b"/>
      <stop offset="0.55" stop-color="#16294a"/>
      <stop offset="1" stop-color="#173b3a"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9be3c0"/>
      <stop offset="1" stop-color="#8fc4ff"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd6ae"/>
      <stop offset="1" stop-color="#3f9a78"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc4ff"/>
      <stop offset="1" stop-color="#4d7fd1"/>
    </linearGradient>
    <linearGradient id="barHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be3c0"/>
      <stop offset="1" stop-color="#3f9a78"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#2f8f7a" stop-opacity=".55"/><stop offset="1" stop-color="#2f8f7a" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#3558b8" stop-opacity=".6"/><stop offset="1" stop-color="#3558b8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#5fbf9a" stop-opacity=".45"/><stop offset="1" stop-color="#5fbf9a" stop-opacity="0"/></radialGradient>
    <clipPath id="shellClip"><ellipse cx="1110" cy="170" rx="62" ry="46"/></clipPath>
    <clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-12px)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .a1{animation:drift 14s ease-in-out infinite}
    .a2{animation:drift 18s ease-in-out infinite reverse}
    .tur{animation:bob 4s ease-in-out infinite}
    .b{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s ease-out both}
    .b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}
    @media (prefers-reduced-motion:reduce){.a1,.a2,.tur,.b{animation:none}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <g>
      <circle class="a1" cx="200" cy="40" r="230" fill="url(#g1)"/>
      <circle class="a2" cx="900" cy="300" r="260" fill="url(#g2)"/>
      <circle class="a1" cx="1200" cy="30" r="200" fill="url(#g3)"/>
    </g>
    <g fill="#ffffff" opacity="0.5">
      <circle cx="640" cy="60" r="2"/><circle cx="700" cy="250" r="2.5"/>
      <circle cx="740" cy="110" r="1.6"/><circle cx="1010" cy="40" r="2"/>
      <circle cx="1230" cy="250" r="2"/><circle cx="60" cy="270" r="2"/>
    </g>
  </g>

  <!-- Text -->
  <text class="f" x="80" y="140" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">Shop<tspan fill="url(#word)">Impact</tspan></text>
  <text class="f" x="82" y="188" font-size="26" fill="#cfe3dc">Log purchases. Inspect the model. Test the change.</text>

  <g class="f" font-size="16" fill="#e8f3ef" text-anchor="middle">
    <rect x="80" y="214" width="170" height="36" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="165" y="237">Python · Streamlit</text>
    <rect x="262" y="214" width="165" height="36" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="344.5" y="237">Inspectable model</text>
    <rect x="439" y="214" width="220" height="36" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="549" y="237">Reproducible experiments</text>
  </g>
  <text class="f" x="82" y="286" font-size="15" fill="#9fb7b0">Illustrative footprint model · not a life-cycle assessment</text>

  <!-- Chart with error bars -->
  <g>
    <line x1="770" y1="265" x2="1010" y2="265" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <rect class="b b1" x="790" y="195" width="36" height="70" rx="4" fill="url(#bar)"/>
    <rect class="b b2" x="850" y="145" width="36" height="120" rx="4" fill="url(#bar)"/>
    <rect class="b b3" x="910" y="175" width="36" height="90" rx="4" fill="url(#bar)"/>
    <rect class="b b4" x="970" y="115" width="36" height="150" rx="4" fill="url(#barHi)"/>
    <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round">
      <path d="M808 181V209M802 181H814M802 209H814"/>
      <path d="M868 129V161M862 129H874M862 161H874"/>
      <path d="M928 160V190M922 160H934M922 190H934"/>
      <path d="M988 96V134M982 96H994M982 134H994"/>
    </g>
    <text class="f" x="770" y="292" font-size="13" fill="#9fb7b0">kg CO₂e ± sensitivity band</text>
  </g>

  <!-- Turtle mascot -->
  <g class="tur">
    <ellipse cx="1070" cy="215" rx="16" ry="10" fill="#6fbf98" transform="rotate(25 1070 215)"/>
    <ellipse cx="1150" cy="215" rx="16" ry="10" fill="#6fbf98" transform="rotate(-25 1150 215)"/>
    <ellipse cx="1070" cy="125" rx="16" ry="10" fill="#6fbf98" transform="rotate(-25 1070 125)"/>
    <ellipse cx="1150" cy="125" rx="16" ry="10" fill="#6fbf98" transform="rotate(25 1150 125)"/>
    <polygon points="1050,171 1034,176 1050,181" fill="#6fbf98"/>
    <ellipse cx="1180" cy="168" rx="22" ry="18" fill="#8fd6ae"/>
    <circle cx="1188" cy="162" r="3.5" fill="#0e1a2b"/>
    <path d="M1180 176q6 4 12 0" stroke="#0e1a2b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="1110" cy="170" rx="62" ry="46" fill="url(#shell)"/>
    <g clip-path="url(#shellClip)" stroke="#2c7a5c" stroke-width="2.5" fill="none" stroke-linejoin="round">
      <polygon points="1128,170 1119,185.6 1101,185.6 1092,170 1101,154.4 1119,154.4" fill="#ffffff" fill-opacity="0.18"/>
      <path d="M1119 154.4L1135 120M1101 154.4L1085 120M1092 170L1040 170M1101 185.6L1085 220M1119 185.6L1135 220M1128 170L1180 170"/>
    </g>
    <ellipse cx="1110" cy="170" rx="62" ry="46" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
