[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "shopimpact-core"
version = "0.1.0"
description = "Versioned EPA-based consumption research and constrained planning"
requires-python = ">=3.11"
license = {text = "MIT"}
[project.scripts]
shopimpact = "shopimpact_core.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
shopimpact_core = ["data/*.json", "data/*.csv"]
